name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests contra Postgres)
    runs-on: ubuntu-latest
    # Los tests de integración usan Postgres real (no H2): la regla que impide
    # reservar dos veces el mismo horario es un índice único parcial de Postgres.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: ci-solo-para-tests
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinica -d clinica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores descartables, solo para este job: no son secretos reales.
      DB_PASSWORD: ci-solo-para-tests
      JWT_SECRET: secreto-solo-para-ci-no-es-un-secreto-real-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests
        run: ./mvnw -B test

  frontend:
    name: Frontend (lint, tipos, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Tipos y build
        run: npm run build
