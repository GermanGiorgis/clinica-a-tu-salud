server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los archivos con hash en el nombre (assets/) no cambian nunca: se pueden guardar un año.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Es una aplicación de una sola página: cualquier ruta (/medicos, /mis-turnos...) la resuelve React.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
