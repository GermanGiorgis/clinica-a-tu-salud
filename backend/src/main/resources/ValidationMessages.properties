# Mensajes por defecto de las validaciones, en el idioma de quien los lee: llegan tal cual al formulario,
# debajo del campo que falló. (Los de la propia aplicación llevan el texto en la anotación.)
jakarta.validation.constraints.NotNull.message=es obligatorio
jakarta.validation.constraints.NotBlank.message=es obligatorio
jakarta.validation.constraints.NotEmpty.message=es obligatorio
jakarta.validation.constraints.Size.message=supera el largo permitido ({max} caracteres como máximo)
jakarta.validation.constraints.Email.message=tiene que ser un email válido, por ejemplo nombre@dominio.com
jakarta.validation.constraints.Pattern.message=tiene un formato inválido
jakarta.validation.constraints.Past.message=tiene que ser una fecha anterior a hoy
jakarta.validation.constraints.PastOrPresent.message=no puede ser una fecha futura
jakarta.validation.constraints.Future.message=tiene que ser una fecha posterior a hoy
jakarta.validation.constraints.FutureOrPresent.message=no puede ser una fecha pasada
jakarta.validation.constraints.Min.message=tiene que ser mayor o igual a {value}
jakarta.validation.constraints.Max.message=tiene que ser menor o igual a {value}
jakarta.validation.constraints.Positive.message=tiene que ser mayor que cero
jakarta.validation.constraints.PositiveOrZero.message=no puede ser negativo
