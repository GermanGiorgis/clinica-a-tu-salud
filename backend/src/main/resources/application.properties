spring.application.name=clinica

server.port=${PORT:8080}
# Detrás de un proxy (Vercel, un balanceador) la IP del cliente viene en X-Forwarded-For; sin esto, el límite de
# intentos por IP (LoginAttemptService) vería a todas las personas como una sola. FORWARD_HEADERS_STRATEGY=native
# solo se activa cuando de verdad hay un proxy de confianza adelante.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Base de datos: en desarrollo la contraseña sale de application-local.properties
# (ignorado por git); en producción se define con la variable DB_PASSWORD.
spring.config.import=optional:classpath:application-local.properties
# Los DB_* tienen prioridad; si no están se usan los PG* que inyecta la integración de Neon en Vercel (PGHOST_UNPOOLED
# es la conexión directa: Flyway y Hibernate no se llevan bien con el pooler en modo transacción).
# DB_URL_PARAMS agrega parámetros al final de la URL, p. ej. ?sslmode=require (Neon exige SSL).
spring.datasource.url=jdbc:postgresql://${DB_HOST:${PGHOST_UNPOOLED:${PGHOST:localhost}}}:${DB_PORT:5432}/${DB_NAME:${PGDATABASE:clinica}}${DB_URL_PARAMS:}
spring.datasource.username=${DB_USER:${PGUSER:clinica}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# El esquema lo crea Flyway; Hibernate solo verifica que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Red de seguridad contra el N+1: las relaciones LAZY que igual se recorran en una lista
# se cargan de a 50 en una sola consulta, en vez de una por fila.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# jwt.secret no tiene default acá a propósito: en dev sale de
# application-local.properties (ignorado por git); en producción, de la
# variable de entorno JWT_SECRET. Sin ninguno de los dos, el arranque falla
# en vez de firmar tokens con un secreto débil conocido.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5176}

# Zona horaria de la clínica: de ella depende qué horarios ya pasaron y la regla de las 2 horas
# para cancelar. No se usa la del servidor (en un contenedor suele ser UTC).
clinica.zona-horaria=${ZONA_HORARIA:America/Argentina/Mendoza}

# Primer usuario ADMIN (ver AdminSeeder). En un entorno real: ADMIN_EMAIL y ADMIN_PASSWORD.
# SEED_DEMO_ADMIN=true crea un admin con credenciales públicas y es SOLO para desarrollo local.
clinica.admin.email=${ADMIN_EMAIL:}
clinica.admin.password=${ADMIN_PASSWORD:}
clinica.seed.demo-admin=${SEED_DEMO_ADMIN:false}
# SEED_DEMO_MEDICOS=true carga profesionales inventados en todas las especialidades (ver MedicosDeDemostracion): SOLO desarrollo local.
clinica.seed.demo-medicos=${SEED_DEMO_MEDICOS:false}
# SEED_DEMO_CUENTAS=true crea una cuenta por rol con contraseña PÚBLICA (ver CuentasDeDemostracion): solo entornos descartables.
clinica.seed.demo-cuentas=${SEED_DEMO_CUENTAS:false}

# Límite de intentos (ver LoginAttemptService): fallos de login por email y por IP dentro de la
# ventana, y altas de cuenta por IP por hora.
clinica.seguridad.login-max-fallos-por-email=${LOGIN_MAX_FALLOS_EMAIL:5}
clinica.seguridad.login-max-fallos-por-ip=${LOGIN_MAX_FALLOS_IP:30}
clinica.seguridad.registro-max-por-ip-por-hora=${REGISTRO_MAX_POR_IP_HORA:10}
clinica.seguridad.ventana-minutos=15

# Reinicio de la demo en línea (ver ReinicioDeDemostracion): una llamada autenticada con CRON_SECRET borra TODA la base y
# la vuelve a cargar con los datos de demostración. Solo funciona con las DOS variables (DEMO_REINICIO y
# FLYWAY_CLEAN_DISABLED=false); en cualquier otro entorno el borrado está apagado.
clinica.demo.reinicio=${DEMO_REINICIO:false}
clinica.demo.reinicio-token=${CRON_SECRET:}
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:true}
