spring.application.name=clinica

server.port=${PORT:8080}

# Base de datos: en desarrollo la contraseña sale de application-local.properties
# (ignorado por git); en producción se define con la variable DB_PASSWORD.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinica}
spring.datasource.username=${DB_USER:clinica}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# El esquema lo crea Flyway; Hibernate solo verifica que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
